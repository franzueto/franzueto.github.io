<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Balloon Blaster</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0e1530;
      overflow: hidden;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

  <!-- Umami analytics. data-domains keeps local dev out of the stats. -->
  <script defer src="https://cloud.umami.is/script.js"
          data-website-id="1854972e-ce01-442b-9e39-87e7573728ee"
          data-domains="franzueto.dev,franzueto.github.io"></script>

  <script src="game.min.js?v=110a6c0b"></script>



</body>
</html>
